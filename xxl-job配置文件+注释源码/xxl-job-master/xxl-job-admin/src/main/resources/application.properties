### web
# 1.服务端口
server.port=8888


# 2.访问调度中心的基础路径
server.servlet.context-path=/xxl-job-admin
### actuator（监控中心配置）
# 1.监控中心在web端访问的基础路径
management.server.base-path=/actuator
# 2.禁用邮件健康检查(作用提高应用的稳定性和可靠性)
management.health.mail.enabled=false
# health 可以查看更多配置信息
#management.endpoints.web.exposure.include=*
#management.endpoint.health.show-details=always


### resources（静态资源配置）
# 1.确保Servlet在服务器启动时立即加载和初始化（提高启动速度，项目启动时间稍微慢一些）
# 正常情况：第一次访问Http请求创建一个DispatcherServlet对象，如果load-on-startup=0 那么就是在启动Tomcat过程中就创建一个DispatcherServlet对象
spring.mvc.servlet.load-on-startup=0
# 2.静态资源在HTTP请求中的访问路径
spring.mvc.static-path-pattern=/static/**
# 3.静态资源位置
spring.web.resources.static-locations=classpath:/static/


### freemarker（模版引擎配置/jsp）
# 1.模版文件位置
spring.freemarker.templateLoaderPath=classpath:/templates/
# 2，模版文件后缀格式
spring.freemarker.suffix=.ftl
# 3.模版文件中文渲染中文字符集
spring.freemarker.charset=UTF-8
# 4.模板文件中直接访问请求的上下文路径（contextPath）
#  http://localhost:8080/xxl-job-admin/static/favicon.ico
#  http://localhost:8080/xxl-job-admin/static/js/index.js
spring.freemarker.request-context-attribute=request
# 5.模板文件中渲染数值时保留精度（保留10位）
spring.freemarker.settings.number_format=0.##########
### mybatis（持久层MyBatis配置）
mybatis.mapper-locations=classpath:/mybatis-mapper/*Mapper.xml


#mybatis.type-aliases-package=com.xxl.job.admin.core.model
### xxl-job, datasource(数据库配置)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=MySQL123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource


### datasource-pool(数据库连接池配置)---客户端调优MySQL()
# 1.数据库连接池最小空闲连接数
spring.datasource.hikari.minimum-idle=10
# 2.数据库连接池最大连接数
spring.datasource.hikari.maximum-pool-size=30
# 3.数据库连接池获取的连接执行完SQL语句之后是否自动提交
spring.datasource.hikari.auto-commit=true
# 4.数据库连接池空闲连接的最大时间（默认10min，最小10s）设置30s 可以避免长时间不使用的连接占用过多资源
spring.datasource.hikari.idle-timeout=30000
# 5.数据库连接池的名字
spring.datasource.hikari.pool-name=HikariCP
# 6.数据库连接池连接的最大存活时间（默认30min 0为存活时间无限大） 设置15min 可以避免长时间连接占用过多资源
spring.datasource.hikari.max-lifetime=900000
# 7.数据库连接池中获取连接的最大连接时间，如果在这个时间内未获取到可用连接，将会抛出 SQLException
spring.datasource.hikari.connection-timeout=10000
# 8.数据库连接池中获取的连接是否有效（通过SELECT 1测试连接的有效性）
spring.datasource.hikari.connection-test-query=SELECT 1
# 9.数据库连接池获取连接时，连接池等待验证连接是否有效的最长时间
spring.datasource.hikari.validation-timeout=1000


### xxl-job, email（spring邮箱配置）
# 1.邮箱服务器地址（例如QQ邮箱服务器地址）
spring.mail.host=smtp.qq.com
# 2.邮箱服务器端口（例如QQ邮箱服务器默认端口25）
spring.mail.port=25
# 3.邮件接受方地址
spring.mail.username=xxx@qq.com
# 4.邮件发送方地址
spring.mail.from=xxx@qq.com
# 5.三方应用访问邮箱的授权码（不是QQ登录密码）
spring.mail.password=xxx
# 6.表示启用SMTP服务器的认证功能（在尝试发送邮件时，需要提供用户名和授权码进行认证）
spring.mail.properties.mail.smtp.auth=true
# 7.表示启用STARTTLS协议 （确保邮件传输过程中的安全性，防止数据在传输过程中被窃听或篡改。）
spring.mail.properties.mail.smtp.starttls.enable=true
# 8.表示强制使用STARTTLS协议
spring.mail.properties.mail.smtp.starttls.required=true
# 9.指定SMTP客户端使用的套接字工厂类（启用 SSL 连接，确保邮件发送过程中的数据传输是加密的）
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
#总的来说 6789保证保邮件发送过程中使用认证和加密


### xxl-job, access token（调度中心和执行器通信令牌）
xxl.job.accessToken=default_token
### xxl-job, i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
xxl.job.i18n=zh_CN
## xxl-job, triggerpool max size（执行定时任务线程池配置）
# 1.执行短期任务线程池最大线程数
xxl.job.triggerpool.fast.max=200
# 2.执行耗时任务线程池最大线程数
xxl.job.triggerpool.slow.max=100
### xxl-job, log retention days
xxl.job.logretentiondays=30
